<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Broken Phone — Sign In</title>

    <link rel="stylesheet" href="signin.css">

</head>

<body>

    <main class="signin-screen">

        <div class="signin-box">

            <h1>BROKEN PHONE</h1>

            <p class="case-label">
                INVESTIGATION DEPARTMENT
            </p>

            <div class="line"></div>

            <label for="playerName">
                ID / NAME
            </label>

            <input
                id="playerName"
                type="text"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <label for="playerPassword">
                PASSWORD
            </label>

            <input
                id="playerPassword"
                type="password"
                placeholder="Enter password"
            >

            <p
                id="errorMessage"
                class="error"
            ></p>

            <button id="enterGame">
                ENTER
            </button>

            <button
                id="backButton"
                class="back-button"
            >
                BACK
            </button>

        </div>

    </main>

    <script src="signin.js"></script>

</body>

</html>
