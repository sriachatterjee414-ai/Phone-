<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Broken Phone</title>

    <link rel="stylesheet" href="menu.css?v=local-save-2">
</head>

<body>

    <main class="menu-screen">

        <!-- Atmospheric floating particles -->
        <div
            class="particles"
            id="particles"
        ></div>


        <!-- Game title -->
        <div class="game-title">
            <span>BROKEN</span>
            <span>PHONE</span>
        </div>


        <!-- Main menu -->
        <nav class="main-menu">

            <button
                class="menu-button"
                id="newGameBtn"
            >
                NEW GAME
            </button>

            <button
                class="menu-button"
                id="continueBtn"
            >
                CONTINUE
            </button>

            <button
                class="menu-button"
                id="settingsBtn"
            >
                SETTINGS
            </button>

            <button
                class="menu-button"
                id="quitBtn"
            >
                QUIT
            </button>

        </nav>


        <section
            class="continue-preview"
            id="continuePreview"
            aria-hidden="true"
        >

            <div
                class="continue-preview-backdrop"
                id="closeContinuePreviewBackdrop"
            ></div>

            <div
                class="continue-preview-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="continuePreviewTitle"
            >

                <button
                    class="close-settings"
                    id="closeContinuePreview"
                    type="button"
                    aria-label="Close saved game preview"
                >
                    ×
                </button>

                <div class="continue-preview-label">
                    LOCAL SAVE
                </div>

                <h2 id="continuePreviewTitle">
                    SAVED GAME
                </h2>

                <div
                    class="continue-preview-details"
                    id="continuePreviewDetails"
                ></div>

                <button
                    class="load-save-button"
                    id="loadSavedGame"
                    type="button"
                >
                    LOAD SAVE
                </button>

                <button
                    class="cancel-save-button"
                    id="cancelContinuePreview"
                    type="button"
                >
                    CANCEL
                </button>

            </div>

        </section>


        <!-- Settings panel -->
        <section
            class="settings-panel"
            id="settingsPanel"
        >

            <button
                class="close-settings"
                id="closeSettings"
            >
                ×
            </button>

            <h2>SETTINGS</h2>

            <label for="volume">
                MASTER VOLUME
            </label>

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="70"
            >

            <p id="volumeValue">
                70%
            </p>

            <button
                class="mute-button"
                id="muteButton"
            >
                SOUND: ON
            </button>

        </section>


        <!-- Quit confirmation -->
        <div
            class="quit-message"
            id="quitMessage"
        >

            <p>
                Are you sure you want to leave?
            </p>

            <button id="stayBtn">
                STAY
            </button>

            <button id="leaveBtn">
                LEAVE
            </button>

        </div>


        <!-- Audio indicator -->
        <button
            class="audio-indicator"
            id="audioIndicator"
            aria-label="Toggle sound"
        >
            ♪
        </button>


        <!--
            MENU AUDIO

            Both files are in the same folder
            as this HTML file.
        -->

        <audio
            id="hallAmbience"
            src="hall_ambience.mp3"
            loop
            preload="auto"
        ></audio>

        <audio
            id="radioStatic"
            src="radio_static.mp3"
            preload="auto"
        ></audio>

    </main>


    <script src="game-save.js?v=save-slot-3"></script>
    <script src="menu.js?v=save-slot-3"></script>

</body>

</html>
