<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Broken Phone</title>

    <link rel="stylesheet" href="menu.css">
</head>

<body>

    <main class="menu-screen">

        <!-- Atmospheric floating particles -->
        <div
            class="particles"
            id="particles"
        ></div>


        <!-- Game title -->
        <div class="game-title">
            <span>BROKEN</span>
            <span>PHONE</span>
        </div>


        <!-- Main menu -->
        <nav class="main-menu">

            <button
                class="menu-button"
                id="newGameBtn"
            >
                NEW GAME
            </button>

            <button
                class="menu-button"
                id="continueBtn"
            >
                CONTINUE
            </button>

            <button
                class="menu-button"
                id="settingsBtn"
            >
                SETTINGS
            </button>

            <button
                class="menu-button"
                id="quitBtn"
            >
                QUIT
            </button>

        </nav>


        <!-- Settings panel -->
        <section
            class="settings-panel"
            id="settingsPanel"
        >

            <button
                class="close-settings"
                id="closeSettings"
            >
                ×
            </button>

            <h2>SETTINGS</h2>

            <label for="volume">
                MASTER VOLUME
            </label>

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="70"
            >

            <p id="volumeValue">
                70%
            </p>

            <button
                class="mute-button"
                id="muteButton"
            >
                SOUND: ON
            </button>

        </section>


        <!-- Quit confirmation -->
        <div
            class="quit-message"
            id="quitMessage"
        >

            <p>
                Are you sure you want to leave?
            </p>

            <button id="stayBtn">
                STAY
            </button>

            <button id="leaveBtn">
                LEAVE
            </button>

        </div>


        <!-- Audio indicator -->
        <button
            class="audio-indicator"
            id="audioIndicator"
            aria-label="Toggle sound"
        >
            ♪
        </button>


        <!--
            MENU AUDIO

            Both files are in the same folder
            as this HTML file.
        -->

        <audio
            id="hallAmbience"
            src="hall_ambience.mp3"
            loop
            preload="auto"
        ></audio>

        <audio
            id="radioStatic"
            src="radio_static.mp3"
            preload="auto"
        ></audio>

    </main>


    <script src="menu.js"></script>

</body>

</html>
