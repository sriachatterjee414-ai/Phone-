<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>

<body>


<header class="app-header">

    <button
        class="back-button"
        onclick="goBack()"
    >
        ‹
    </button>

    <h1>Messages</h1>

    <div></div>

</header>


<main id="messageList">


    <div
        class="message-row"
        onclick="openChat('unknown')"
    >

        <div class="avatar">
            ?
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    Unknown Number
                </strong>

                <span>
                    2:50 PM
                </span>

            </div>

            <p>
                Are you still coming tonight?
            </p>

        </div>

    </div>



    <div
        class="message-row"
        onclick="openChat('emma')"
    >

        <div class="avatar purple">
            E
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    Emma
                </strong>

                <span>
                    9:54 AM
                </span>

            </div>

            <p>
                Hehe
            </p>

        </div>

    </div>



    <div
        class="message-row"
        onclick="openChat('code')"
    >

        <div class="avatar">
            ?
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    52927
                </strong>

                <span>
                    9:47 AM
                </span>

            </div>

            <p>
                Don't forget what we discussed.
            </p>

        </div>

    </div>



    <div
        class="message-row"
        onclick="openChat('evelyn')"
    >

        <div class="avatar pink">
            E
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    Evelyn
                </strong>

                <span>
                    Yesterday
                </span>

            </div>

            <p>
                Can we talk somewhere private?
            </p>

        </div>

    </div>



    <div
        class="message-row"
        onclick="openChat('jenzia')"
    >

        <div class="avatar">
            J
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    Jenzia
                </strong>

                <span>
                    Yesterday
                </span>

            </div>

            <p>
                We need to talk.
            </p>

        </div>

    </div>



    <div
        class="message-row"
        onclick="openChat('mom')"
    >

        <div class="avatar">
            M
        </div>

        <div class="message-info">

            <div class="top">

                <strong>
                    Mom
                </strong>

                <span>
                    Tuesday
                </span>

            </div>

            <p>
                Call me when you get home.
            </p>

        </div>

    </div>

</main>


<script src="messages.js"></script>

</body>
</html>
