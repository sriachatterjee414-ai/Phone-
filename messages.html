<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messages</title>

    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="messages.css">

</head>


<body>

<main id="messagesApp">

    <!-- =========================================
         MESSAGES LIST SCREEN
    ========================================== -->

    <section id="messageScreen" class="screen">

        <header class="messages-header">

            <div class="header-left">

                <button
                    class="back-button"
                    id="backBtn"
                    aria-label="Back"
                >
                    ‹
                </button>

                <h1>Messages</h1>

            </div>


            <button
                class="compose-button"
                id="newBtn"
                aria-label="New message"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M4 20h4.2L19.7 8.5a2.4 2.4 0 0 0 0-3.4l-.8-.8a2.4 2.4 0 0 0-3.4 0L4 15.8V20Z"
                    />
                    <path
                        d="M14.4 5.6 18.4 9.6"
                    />
                    <path
                        d="M20 14v6h-6"
                    />
                </svg>
            </button>

        </header>


        <!-- SEARCH -->

        <div class="search-area">

            <div class="search-box">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="6.5"
                    />

                    <path
                        d="m16 16 5 5"
                    />
                </svg>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search"
                    autocomplete="off"
                >

                <button
                    id="clearSearch"
                    class="clear-search"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- FAVORITE / RECENT CONTACTS -->

        <div
            id="contactStrip"
            class="contact-strip"
        >
        </div>


        <!-- FILTER -->

        <div class="filter-row">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="unread"
            >
                Unread
            </button>

        </div>


        <!-- MESSAGE LIST -->

        <div
            id="messageList"
            class="message-list"
        >
        </div>

    </section>


    <!-- =========================================
         CHAT SCREEN
    ========================================== -->

    <section
        id="chatScreen"
        class="screen chat-screen hidden"
    >

        <header class="chat-header">

            <button
                id="chatBack"
                class="chat-back"
                aria-label="Back"
            >
                ‹
            </button>


            <div
                id="chatAvatar"
                class="chat-avatar"
            >
            </div>


            <div class="chat-person">

                <strong id="chatName">
                    Contact
                </strong>

                <small id="chatStatus">
                    No response
                </small>

            </div>

        </header>


        <div
            id="chatMessages"
            class="chat-messages"
        >
        </div>


        <!-- COMPOSER -->

        <div class="composer">

            <button
                class="composer-button"
                id="attachmentBtn"
                aria-label="Attachment"
            >
                <svg
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M12 5v14M5 12h14"
                    />
                </svg>
            </button>


            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Message..."
                autocomplete="off"
            >


            <button
                class="send-button"
                id="sendBtn"
                aria-label="Send"
            >
                <svg
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M5 12h13"
                    />

                    <path
                        d="m13 6 6 6-6 6"
                    />
                </svg>
            </button>

        </div>

    </section>

</main>


<script src="messages.js"></script>

</body>

</html>
