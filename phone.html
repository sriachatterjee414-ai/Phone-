<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Broken Phone</title>

    <link rel="stylesheet" href="phone.css">
</head>


<body>

<div class="investigation-stage">


    <!-- =====================================================
         GAME UI BUTTONS
         These are NOT Android-style.
         They use your Broken Phone game UI.
    ====================================================== -->

    <div class="game-controls">

        <button id="victimInfoButton"
                class="game-button">

            VICTIM INFO

        </button>


        <button id="phoneToggle"
                class="game-button">

            HIDE PHONE

        </button>

    </div>



    <!-- =====================================================
         PHONE
    ====================================================== -->

    <section id="phoneShell"
             class="phone-shell"
             aria-label="Broken Phone">


        <div class="phone-frame">

            <div class="phone-bezel">


                <!-- =================================================
                     LOCK SCREEN
                ================================================== -->

                <div id="lockScreen"
                     class="screen lock-screen">


                    <!-- Android status bar -->

                    <div class="android-status">

                        <span id="lockStatusTime">
                            00:00
                        </span>


                        <div class="status-right">

                            <span>▮▮▮</span>
                            <span>⌁</span>
                            <span>▰</span>

                        </div>

                    </div>



                    <div id="lockDate"
                         class="lock-date">

                        Sunday, September 27

                    </div>


                    <div id="lockTime"
                         class="lock-time">

                        00:00

                    </div>



                    <div class="lock-weather">

                        <span class="weather-symbol">
                            ☁
                        </span>

                        <span>
                            28°
                        </span>

                    </div>



                    <div class="lock-bottom">


                        <div class="lock-shortcut">
                            ●
                        </div>


                        <div class="unlock-hint">

                            <span class="unlock-arrow">
                                ↑
                            </span>

                            <span>
                                Swipe up to unlock
                            </span>

                        </div>


                        <div class="lock-shortcut">
                            ▣
                        </div>


                    </div>

                </div>



                <!-- =================================================
                     PASSCODE
                ================================================== -->

                <div id="passcodeScreen"
                     class="screen passcode-screen hidden">


                    <div class="android-status">

                        <span id="passcodeTime">
                            00:00
                        </span>

                        <div class="status-right">

                            <span>▮▮▮</span>
                            <span>⌁</span>
                            <span>▰</span>

                        </div>

                    </div>



                    <div class="passcode-title">

                        <div class="passcode-lock">
                            ⌑
                        </div>

                        <h2>
                            Enter passcode
                        </h2>

                        <p>
                            Swipe down to return
                        </p>

                    </div>



                    <div id="passcodeDots"
                         class="passcode-dots">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>



                    <div id="passcodePad"
                         class="passcode-pad">
                    </div>


                    <div id="passcodeError"
                         class="passcode-error">
                    </div>

                </div>



                <!-- =================================================
                     HOME SCREEN
                ================================================== -->

                <div id="homeScreen"
                     class="screen home-screen hidden">


                    <div class="android-status">

                        <span id="homeStatusTime">
                            00:00
                        </span>

                        <div class="status-right">

                            <span>▮▮▮</span>
                            <span>⌁</span>
                            <span>▰</span>

                        </div>

                    </div>



                    <!-- =================================================
                         SWIPEABLE HOME PAGES
                    ================================================== -->

                    <div id="homePages"
                         class="home-pages">


                        <!-- ================= PAGE 1 ================= -->

                        <div class="home-page">


                            <div class="android-clock-widget">

                                <div id="homeBigTime">
                                    00:00
                                </div>

                                <div id="homeDate">
                                    Sunday, September 27
                                </div>

                            </div>



                            <!-- Google-style search -->

                            <div class="google-search">

                                <span class="google-g">
                                    G
                                </span>


                                <input id="appSearch"
                                       type="search"
                                       placeholder="Search"
                                       autocomplete="off">


                                <button id="clearSearch"
                                        aria-label="Clear search">

                                    ×

                                </button>


                                <span class="mic">
                                    ●
                                </span>

                            </div>



                            <!-- APPS -->

                            <div class="app-grid">


                                <button class="app-icon"
                                        data-app="calls">

                                    <span class="real-icon phone-icon">
                                        ☎
                                    </span>

                                    <span>
                                        Phone
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="messages">

                                    <span class="real-icon messages-icon">
                                        ●
                                    </span>

                                    <span>
                                        Messages
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="gallery">

                                    <span class="real-icon gallery-icon">
                                        ▧
                                    </span>

                                    <span>
                                        Gallery
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="notes">

                                    <span class="real-icon notes-icon">
                                        ✉
                                    </span>

                                    <span>
                                        Notes
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="contacts">

                                    <span class="real-icon contacts-icon">
                                        ♟
                                    </span>

                                    <span>
                                        Contacts
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="browser">

                                    <span class="real-icon browser-icon">
                                        ◉
                                    </span>

                                    <span>
                                        Browser
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="camera">

                                    <span class="real-icon camera-icon">
                                        ●
                                    </span>

                                    <span>
                                        Camera
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="settings">

                                    <span class="real-icon settings-icon">
                                        ⚙
                                    </span>

                                    <span>
                                        Settings
                                    </span>

                                </button>


                            </div>

                        </div>



                        <!-- ================= PAGE 2 ================= -->

                        <div class="home-page">


                            <div class="page-label">
                                APPS
                            </div>


                            <div class="app-grid">


                                <button class="app-icon"
                                        data-app="bank">

                                    <span class="real-icon bank-icon">
                                        $
                                    </span>

                                    <span>
                                        Bank
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="music">

                                    <span class="real-icon music-icon">
                                        ♪
                                    </span>

                                    <span>
                                        Music
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="clock">

                                    <span class="real-icon clock-icon">
                                        ◷
                                    </span>

                                    <span>
                                        Clock
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="calls">

                                    <span class="real-icon phone-icon">
                                        ☎
                                    </span>

                                    <span>
                                        Phone
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="messages">

                                    <span class="real-icon messages-icon">
                                        ●
                                    </span>

                                    <span>
                                        Messages
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="gallery">

                                    <span class="real-icon gallery-icon">
                                        ▧
                                    </span>

                                    <span>
                                        Gallery
                                    </span>

                                </button>


                            </div>

                        </div>



                        <!-- ================= PAGE 3 ================= -->

                        <div class="home-page">


                            <div class="page-label">
                                MORE
                            </div>


                            <div class="app-grid">


                                <button class="app-icon"
                                        data-app="victimInfo">

                                    <span class="real-icon victim-icon">
                                        !
                                    </span>

                                    <span>
                                        Victim Info
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="settings">

                                    <span class="real-icon settings-icon">
                                        ⚙
                                    </span>

                                    <span>
                                        Settings
                                    </span>

                                </button>



                                <button class="app-icon"
                                        data-app="browser">

                                    <span class="real-icon browser-icon">
                                        ◉
                                    </span>

                                    <span>
                                        Browser
                                    </span>

                                </button>


                            </div>

                        </div>


                    </div>



                    <!-- SEARCH RESULTS -->

                    <div id="searchResults"
                         class="search-results hidden">
                    </div>



                    <!-- PAGE DOTS -->

                    <div id="pageDots"
                         class="page-dots">

                        <span class="active"></span>
                        <span></span>
                        <span></span>

                    </div>



                    <!-- ANDROID DOCK -->

                    <div class="android-dock">


                        <button class="dock-icon phone-icon"
                                data-app="calls">

                            ☎

                        </button>


                        <button class="dock-icon messages-icon"
                                data-app="messages">

                            ●

                        </button>


                        <button class="dock-icon gallery-icon"
                                data-app="gallery">

                            ▧

                        </button>


                        <button class="dock-icon browser-icon"
                                data-app="browser">

                            ◉

                        </button>


                    </div>


                </div>



                <!-- =================================================
                     APP SCREEN
                ================================================== -->

                <div id="appScreen"
                     class="screen app-screen hidden">


                    <div class="app-topbar">


                        <button id="appBack"
                                class="android-back">

                            ‹

                        </button>


                        <div class="app-title">

                            <span id="appHeaderIcon"
                                  class="header-app-icon">

                                ●

                            </span>


                            <span id="appHeaderName">
                                App
                            </span>

                        </div>


                    </div>


                    <iframe id="appFrame"
                            title="Phone Application">
                    </iframe>


                </div>



                <!-- =================================================
                     ANDROID NAVIGATION
                ================================================== -->

                <div id="androidNav"
                     class="android-nav hidden">


                    <button id="navBack">
                        ◀
                    </button>


                    <button id="navHome">
                        ○
                    </button>


                    <button id="navRecent">
                        ▢
                    </button>


                </div>



                <!-- =================================================
                     RECENT APPS
                ================================================== -->

                <div id="recentPanel"
                     class="recent-panel hidden">


                    <div class="recent-title">
                        RECENT APPS
                    </div>


                    <div id="recentList">
                    </div>


                    <button id="closeRecent"
                            class="recent-close">

                        CLOSE

                    </button>


                </div>


            </div>

        </div>

    </section>

</div>


<script src="phone.js"></script>

</body>
</html>
