<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Broken Phone</title>

    <link rel="stylesheet" href="phone.css">
</head>

<body>

<div class="investigation-stage">

    <!-- =========================================
         OUTSIDE-PHONE CONTROLS
         ========================================= -->

    <aside class="game-controls">

        <button id="victimInfoButton" class="game-side-button">
            <span class="side-button-icon victim-file-icon"></span>
            <span class="side-button-text">
                <strong>VICTIM FILE</strong>
                <small>CASE INFORMATION</small>
            </span>
        </button>

        <button id="phoneToggle" class="game-side-button">
            <span class="side-button-icon device-icon"></span>
            <span class="side-button-text">
                <strong id="phoneToggleText">CLOSE DEVICE</strong>
                <small id="phoneToggleSubtext">SECURE PHONE</small>
            </span>
        </button>

    </aside>


    <!-- =========================================
         PHONE
         ========================================= -->

    <section id="phoneShell" class="phone-shell">

        <div class="phone-frame">

            <div class="phone-bezel">


                <!-- =================================
                     LOCK SCREEN
                     ================================= -->

                <div id="lockScreen"
                     class="screen lock-screen">

                    <div class="android-status">

                        <span id="lockStatusTime">00:00</span>

                        <div class="status-right">
                            <span class="signal-icon"></span>
                            <span class="wifi-icon"></span>
                            <span class="battery-icon"></span>
                        </div>

                    </div>


                    <div id="lockDate"
                         class="lock-date">
                        Sunday, September 27
                    </div>

                    <div id="lockTime"
                         class="lock-time">
                        00:00
                    </div>


                    <div class="lock-weather">

                        <span class="weather-symbol">☁</span>
                        <span>28°</span>

                    </div>


                    <div class="lock-bottom">

                        <button class="lock-shortcut"
                                aria-label="Camera">
                            <span class="camera-mini-icon"></span>
                        </button>


                        <div class="unlock-hint">

                            <span class="unlock-arrow">↑</span>

                            <span>
                                Swipe up to unlock
                            </span>

                        </div>


                        <button class="lock-shortcut"
                                aria-label="Phone">
                            <span class="phone-mini-icon"></span>
                        </button>

                    </div>

                </div>


                <!-- =================================
                     PASSCODE
                     ================================= -->

                <div id="passcodeScreen"
                     class="screen passcode-screen hidden">

                    <div class="android-status">

                        <span id="passcodeTime">
                            00:00
                        </span>

                        <div class="status-right">
                            <span class="signal-icon"></span>
                            <span class="wifi-icon"></span>
                            <span class="battery-icon"></span>
                        </div>

                    </div>


                    <div class="passcode-title">

                        <span class="passcode-lock-icon"></span>

                        <h2>Enter passcode</h2>

                        <p>
                            Passcode required
                        </p>

                    </div>


                    <div id="passcodeDots"
                         class="passcode-dots">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div id="passcodePad"
                         class="passcode-pad">
                    </div>


                    <div id="passcodeError"
                         class="passcode-error">
                    </div>

                </div>


                <!-- =================================
                     HOME
                     ================================= -->

                <div id="homeScreen"
                     class="screen home-screen hidden">

                    <div class="android-status">

                        <span id="homeStatusTime">
                            00:00
                        </span>

                        <div class="status-right">
                            <span class="signal-icon"></span>
                            <span class="wifi-icon"></span>
                            <span class="battery-icon"></span>
                        </div>

                    </div>


                    <div id="homePages"
                         class="home-pages">


                        <!-- =========================
                             PAGE 1
                             ========================= -->

                        <div class="home-page">

                            <div class="android-clock-widget">

                                <div id="homeBigTime">
                                    00:00
                                </div>

                                <div id="homeDate">
                                    Sunday, September 27
                                </div>

                            </div>


                            <div class="google-search">

                                <span class="google-g">G</span>

                                <input id="appSearch"
                                       type="search"
                                       placeholder="Search"
                                       autocomplete="off">

                                <button id="clearSearch"
                                        aria-label="Clear">
                                    ×
                                </button>

                                <span class="search-mic-icon"></span>

                            </div>


                            <div class="app-grid">

                                <button class="app-icon"
                                        data-app="calls">
                                    <span class="real-icon phone-icon"></span>
                                    <span>Phone</span>
                                </button>


                                <button class="app-icon"
                                        data-app="messages">
                                    <span class="real-icon messages-icon"></span>
                                    <span>Messages</span>
                                </button>


                                <button class="app-icon"
                                        data-app="gallery">
                                    <span class="real-icon gallery-icon"></span>
                                    <span>Gallery</span>
                                </button>


                                <button class="app-icon"
                                        data-app="notes">
                                    <span class="real-icon notes-icon"></span>
                                    <span>Notes</span>
                                </button>


                                <button class="app-icon"
                                        data-app="contacts">
                                    <span class="real-icon contacts-icon"></span>
                                    <span>Contacts</span>
                                </button>


                                <button class="app-icon"
                                        data-app="browser">
                                    <span class="real-icon browser-icon"></span>
                                    <span>Browser</span>
                                </button>


                                <button class="app-icon"
                                        data-app="camera">
                                    <span class="real-icon camera-icon"></span>
                                    <span>Camera</span>
                                </button>


                                <button class="app-icon"
                                        data-app="settings">
                                    <span class="real-icon settings-icon"></span>
                                    <span>Settings</span>
                                </button>

                            </div>

                        </div>


                        <!-- =========================
                             PAGE 2
                             ========================= -->

                        <div class="home-page">

                            <div class="page-label">
                                APPS
                            </div>


                            <div class="app-grid">

                                <button class="app-icon"
                                        data-app="bank">
                                    <span class="real-icon bank-icon"></span>
                                    <span>Bank</span>
                                </button>


                                <button class="app-icon"
                                        data-app="music">
                                    <span class="real-icon music-icon"></span>
                                    <span>Music</span>
                                </button>


                                <button class="app-icon"
                                        data-app="clock">
                                    <span class="real-icon clock-icon"></span>
                                    <span>Clock</span>
                                </button>

                            </div>

                        </div>


                        <!-- =========================
                             PAGE 3
                             ========================= -->

                        <div class="home-page">

                            <div class="page-label">
                                MORE
                            </div>


                            <div class="app-grid">

                                <button class="app-icon"
                                        data-app="files">
                                    <span class="real-icon files-icon"></span>
                                    <span>Files</span>
                                </button>


                                <button class="app-icon"
                                        data-app="settings">
                                    <span class="real-icon settings-icon"></span>
                                    <span>Settings</span>
                                </button>


                                <button class="app-icon"
                                        data-app="browser">
                                    <span class="real-icon browser-icon"></span>
                                    <span>Browser</span>
                                </button>

                            </div>

                        </div>

                    </div>


                    <div id="searchResults"
                         class="search-results hidden">
                    </div>


                    <div id="pageDots"
                         class="page-dots">

                        <span class="active"></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- DOCK -->

                    <div class="android-dock">

                        <button class="dock-icon phone-icon"
                                data-app="calls">
                        </button>

                        <button class="dock-icon messages-icon"
                                data-app="messages">
                        </button>

                        <button class="dock-icon gallery-icon"
                                data-app="gallery">
                        </button>

                        <button class="dock-icon browser-icon"
                                data-app="browser">
                        </button>

                    </div>


                    <!-- NAVIGATION -->

                    <div id="androidNav"
                         class="android-nav">

                        <button id="navBack"
                                aria-label="Back">
                            <span class="nav-back-icon"></span>
                        </button>

                        <button id="navHome"
                                aria-label="Home">
                            <span class="nav-home-icon"></span>
                        </button>

                        <button id="navRecent"
                                aria-label="Recent">
                            <span class="nav-recent-icon"></span>
                        </button>

                    </div>


                    <!-- RECENT -->

                    <div id="recentPanel"
                         class="recent-panel hidden">

                        <div class="recent-title">
                            RECENT APPS
                        </div>

                        <div id="recentList"></div>

                        <button id="closeRecent"
                                class="recent-close">
                            CLOSE
                        </button>

                    </div>

                </div>


                <!-- =================================
                     PHONE APP
                     ================================= -->

                <div id="appScreen"
                     class="screen app-screen hidden">

                    <div class="app-topbar">

                        <button id="appBack"
                                class="android-back"
                                aria-label="Back">
                            <span class="nav-back-icon"></span>
                        </button>


                        <div class="app-title">

                            <span id="appHeaderIcon"
                                  class="header-app-icon">
                            </span>

                            <span id="appHeaderName">
                                App
                            </span>

                        </div>

                    </div>


                    <iframe id="appFrame"
                            title="Phone Application">
                    </iframe>

                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
         VICTIM INFO — OUTSIDE THE PHONE
         ========================================= -->

    <section id="victimPanel"
             class="victim-panel hidden">

        <div class="victim-panel-header">

            <div>
                <span class="victim-panel-kicker">
                    INVESTIGATION DEPARTMENT
                </span>

                <h1>
                    VICTIM FILE
                </h1>
            </div>


            <button id="closeVictimInfo"
                    class="victim-close"
                    aria-label="Close victim information">
                <span></span>
                <span></span>
            </button>

        </div>


        <iframe id="victimFrame"
                src=""
                title="Victim Information">
        </iframe>

    </section>

</div>


<script src="phone.js"></script>

</body>
</html>
