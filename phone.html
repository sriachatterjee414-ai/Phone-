<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

    <title>Broken Phone</title>

    <link rel="stylesheet" href="phone.css">
</head>

<body>

<div class="investigation-stage">

    <!-- =========================================
         OUTSIDE-PHONE CONTROLS
    ========================================== -->

    <aside class="game-controls">

        <button id="victimInfoButton"
                class="side-control victim-control"
                type="button">

            <span class="side-control-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3.5h9l3 3V20.5H6z"/>
                    <path d="M15 3.5v4h3"/>
                    <path d="M9 11h6"/>
                    <path d="M9 14h6"/>
                    <path d="M9 17h4"/>
                </svg>
            </span>

            <span class="side-control-text">
                VICTIM FILE
            </span>

        </button>


        <button id="phoneToggle"
                class="side-control"
                type="button">

            <span class="side-control-icon">

                <svg id="toggleIcon"
                     viewBox="0 0 24 24"
                     aria-hidden="true">

                    <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
                    <path d="M10 5h4"/>
                    <circle cx="12" cy="18.5" r=".8"
                            fill="currentColor"
                            stroke="none"/>
                </svg>

            </span>

            <span id="toggleText"
                  class="side-control-text">
                CLOSE PHONE
            </span>

        </button>

    </aside>


    <!-- =========================================
         PHONE
    ========================================== -->

    <section id="phoneShell"
             class="phone-shell">

        <div class="phone-frame">

            <div class="phone-bezel">


                <!-- =================================
                     LOCK SCREEN
                ================================== -->

                <div id="lockScreen"
                     class="screen lock-screen">

                    <div class="android-status">

                        <span id="lockStatusTime">
                            00:00
                        </span>

                        <div class="status-right">

                            <span class="signal-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 18h2v3H3zM7 15h2v6H7zM11 11h2v10h-2zM15 7h2v14h-2z"/>
                                </svg>
                            </span>

                            <span class="wifi-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 8.5C8 4.5 16 4.5 21 8.5"/>
                                    <path d="M6 12c3.5-2.7 8.5-2.7 12 0"/>
                                    <path d="M9.5 15.5c1.5-1.1 3.5-1.1 5 0"/>
                                    <circle cx="12" cy="19" r="1"/>
                                </svg>
                            </span>

                            <span class="battery-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="6" width="17" height="12" rx="2"/>
                                    <path d="M21 10v4"/>
                                </svg>
                            </span>

                        </div>

                    </div>


                    <div id="lockDate"
                         class="lock-date">
                        Sunday, September 27
                    </div>


                    <div id="lockTime"
                         class="lock-time">
                        00:00
                    </div>


                    <div class="lock-weather">

                        <svg viewBox="0 0 32 32">
                            <path d="M9 24h14a6 6 0 0 0 0-12 8 8 0 0 0-15-1A6 6 0 0 0 9 24z"/>
                        </svg>

                        <span>28°</span>

                    </div>


                    <div class="lock-bottom">

                        <button class="lock-shortcut"
                                type="button">

                            <svg viewBox="0 0 24 24">
                                <path d="M7 5h10v14H7z"/>
                                <path d="M9.5 8h5"/>
                                <path d="M9.5 11h5"/>
                                <path d="M9.5 14h3"/>
                            </svg>

                        </button>


                        <div class="unlock-hint">

                            <span class="unlock-arrow">
                                ↑
                            </span>

                            <span>
                                Swipe up to unlock
                            </span>

                        </div>


                        <button class="lock-shortcut"
                                type="button">

                            <svg viewBox="0 0 24 24">
                                <path d="M4 7h16v12H4z"/>
                                <circle cx="12" cy="13" r="3.5"/>
                                <path d="M8 7l1.5-2h5L16 7"/>
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- =================================
                     PASSCODE
                ================================== -->

                <div id="passcodeScreen"
                     class="screen passcode-screen hidden">

                    <div class="android-status">

                        <span id="passcodeTime">
                            00:00
                        </span>

                        <div class="status-right">
                            <span>▮▮▮</span>
                            <span>⌁</span>
                            <span>▰</span>
                        </div>

                    </div>


                    <div class="passcode-title">

                        <svg viewBox="0 0 24 24"
                             class="passcode-lock">

                            <rect x="5" y="10" width="14" height="10" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>

                        </svg>

                        <h2>
                            Enter passcode
                        </h2>

                        <p>
                            Swipe down to return
                        </p>

                    </div>


                    <div id="passcodeDots"
                         class="passcode-dots">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div id="passcodePad"
                         class="passcode-pad">
                    </div>


                    <div id="passcodeError"
                         class="passcode-error">
                    </div>

                </div>


                <!-- =================================
                     HOME
                ================================== -->

                <div id="homeScreen"
                     class="screen home-screen hidden">

                    <div class="android-status">

                        <span id="homeStatusTime">
                            00:00
                        </span>

                        <div class="status-right">

                            <span class="signal-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 18h2v3H3zM7 15h2v6H7zM11 11h2v10h-2zM15 7h2v14h-2z"/>
                                </svg>
                            </span>

                            <span class="wifi-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 8.5C8 4.5 16 4.5 21 8.5"/>
                                    <path d="M6 12c3.5-2.7 8.5-2.7 12 0"/>
                                    <path d="M9.5 15.5c1.5-1.1 3.5-1.1 5 0"/>
                                    <circle cx="12" cy="19" r="1"/>
                                </svg>
                            </span>

                            <span class="battery-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="6" width="17" height="12" rx="2"/>
                                    <path d="M21 10v4"/>
                                </svg>
                            </span>

                        </div>

                    </div>


                    <div id="homePages"
                         class="home-pages">


                        <!-- =========================
                             PAGE 1
                        ========================== -->

                        <div class="home-page">

                            <div class="android-clock-widget">

                                <div id="homeBigTime">
                                    00:00
                                </div>

                                <div id="homeDate">
                                    Sunday, September 27
                                </div>

                            </div>


                            <div class="google-search">

                                <svg class="google-search-icon"
                                     viewBox="0 0 24 24">

                                    <path d="M21 21l-4.4-4.4"/>
                                    <circle cx="10.5"
                                            cy="10.5"
                                            r="6.5"/>

                                </svg>

                                <input id="appSearch"
                                       type="search"
                                       placeholder="Search"
                                       autocomplete="off">

                                <button id="clearSearch"
                                        type="button">

                                    ×

                                </button>

                                <svg class="mic-icon"
                                     viewBox="0 0 24 24">

                                    <rect x="8"
                                          y="3"
                                          width="8"
                                          height="12"
                                          rx="4"/>

                                    <path d="M5 11a7 7 0 0 0 14 0"/>
                                    <path d="M12 18v3"/>
                                    <path d="M9 21h6"/>

                                </svg>

                            </div>


                            <div class="app-grid">

                                <!-- PHONE -->
                                <button class="app-icon"
                                        data-app="calls">

                                    <span class="real-icon phone-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M6.5 3.5l3 3-2 2.2c1.2 2.4 3 4.1 5.3 5.3l2.2-2 3 3c.6.6.6 1.5 0 2.1l-1.4 1.4c-.8.8-2 1.1-3.1.7-4.8-1.7-8.5-5.4-10.2-10.2-.4-1.1-.1-2.3.7-3.1l1.4-1.4c.6-.6 1.5-.6 2.1 0z"/>
                                        </svg>
                                    </span>

                                    <span>
                                        Phone
                                    </span>

                                </button>


                                <!-- MESSAGES -->
                                <button class="app-icon"
                                        data-app="messages">

                                    <span class="real-icon messages-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4.2A3.5 3.5 0 0 1 4 12.5z"/>
                                        </svg>
                                    </span>

                                    <span>
                                        Messages
                                    </span>

                                </button>


                                <!-- GALLERY -->
                                <button class="app-icon"
                                        data-app="gallery">

                                    <span class="real-icon gallery-icon">
                                        <svg viewBox="0 0 24 24">
                                            <rect x="3"
                                                  y="3"
                                                  width="18"
                                                  height="18"
                                                  rx="3"/>

                                            <circle cx="8"
                                                    cy="8"
                                                    r="1.8"/>

                                            <path d="M4.5 18l5-5 3.5 3 2.5-2.5 4 4.5"/>
                                        </svg>
                                    </span>

                                    <span>
                                        Gallery
                                    </span>

                                </button>


                                <!-- NOTES -->
                                <button class="app-icon"
                                        data-app="notes">

                                    <span class="real-icon notes-icon">
                                        <svg viewBox="0 0 24 24">
                                            <rect x="5"
                                                  y="3"
                                                  width="14"
                                                  height="18"
                                                  rx="2"/>

                                            <path d="M8 8h8"/>
                                            <path d="M8 12h8"/>
                                            <path d="M8 16h5"/>
                                        </svg>
                                    </span>

                                    <span>
                                        Notes
                                    </span>

                                </button>


                                <!-- CONTACTS -->
                                <button class="app-icon"
                                        data-app="contacts">

                                    <span class="real-icon contacts-icon">
                                        <svg viewBox="0 0 24 24">

                                            <circle cx="12"
                                                    cy="8"
                                                    r="3"/>

                                            <path d="M6.5 20c.5-4 2.5-6 5.5-6s5 2 5.5 6"/>

                                        </svg>
                                    </span>

                                    <span>
                                        Contacts
                                    </span>

                                </button>


                                <!-- BROWSER -->
                                <button class="app-icon"
                                        data-app="browser">

                                    <span class="real-icon browser-icon">
                                        <svg viewBox="0 0 24 24">

                                            <circle cx="12"
                                                    cy="12"
                                                    r="8"/>

                                            <path d="M4 12h16"/>
                                            <path d="M12 4c2.2 2.3 3.2 5 3.2 8S14.2 17.7 12 20"/>
                                            <path d="M12 4c-2.2 2.3-3.2 5-3.2 8S9.8 17.7 12 20"/>

                                        </svg>
                                    </span>

                                    <span>
                                        Browser
                                    </span>

                                </button>


                                <!-- CAMERA -->
                                <button class="app-icon"
                                        data-app="camera">

                                    <span class="real-icon camera-icon">

                                        <svg viewBox="0 0 24 24">

                                            <path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/>

                                            <circle cx="12"
                                                    cy="13"
                                                    r="4"/>

                                        </svg>

                                    </span>

                                    <span>
                                        Camera
                                    </span>

                                </button>


                                <!-- SETTINGS -->
                                <button class="app-icon"
                                        data-app="settings">

                                    <span class="real-icon settings-icon">

                                        <svg viewBox="0 0 24 24">

                                            <circle cx="12"
                                                    cy="12"
                                                    r="3"/>

                                            <path d="M19 13.5v-3l-2-.6a7 7 0 0 0-.7-1.7l.9-1.8-2.1-2.1-1.8.9a7 7 0 0 0-1.7-.7L11 2.5h-3l-.6 2a7 7 0 0 0-1.7.7l-1.8-.9-2.1 2.1.9 1.8a7 7 0 0 0-.7 1.7l-2 .6v3l2 .6c.2.6.4 1.2.7 1.7l-.9 1.8 2.1 2.1 1.8-.9c.5.3 1.1.5 1.7.7l.6 2h3l.6-2c.6-.2 1.2-.4 1.7-.7l1.8.9 2.1-2.1-.9-1.8c.3-.5.5-1.1.7-1.7z"/>

                                        </svg>

                                    </span>

                                    <span>
                                        Settings
                                    </span>

                                </button>

                            </div>

                        </div>


                        <!-- =========================
                             PAGE 2
                        ========================== -->

                        <div class="home-page">

                            <div class="page-label">
                                APPS
                            </div>

                            <div class="app-grid">

                                <button class="app-icon"
                                        data-app="bank">

                                    <span class="real-icon bank-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M3 9h18L12 4z"/>
                                            <path d="M5 9v9"/>
                                            <path d="M9 9v9"/>
                                            <path d="M15 9v9"/>
                                            <path d="M19 9v9"/>
                                            <path d="M3 20h18"/>
                                        </svg>
                                    </span>

                                    <span>Bank</span>

                                </button>


                                <button class="app-icon"
                                        data-app="music">

                                    <span class="real-icon music-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M9 18V6l10-2v12"/>
                                            <circle cx="6"
                                                    cy="18"
                                                    r="3"/>
                                            <circle cx="16"
                                                    cy="16"
                                                    r="3"/>
                                        </svg>
                                    </span>

                                    <span>Music</span>

                                </button>


                                <button class="app-icon"
                                        data-app="clock">

                                    <span class="real-icon clock-icon">
                                        <svg viewBox="0 0 24 24">
                                            <circle cx="12"
                                                    cy="12"
                                                    r="8"/>
                                            <path d="M12 7v5l3 2"/>
                                        </svg>
                                    </span>

                                    <span>Clock</span>

                                </button>


                                <button class="app-icon"
                                        data-app="calls">

                                    <span class="real-icon phone-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M6.5 3.5l3 3-2 2.2c1.2 2.4 3 4.1 5.3 5.3l2.2-2 3 3c.6.6.6 1.5 0 2.1l-1.4 1.4c-.8.8-2 1.1-3.1.7-4.8-1.7-8.5-5.4-10.2-10.2-.4-1.1-.1-2.3.7-3.1l1.4-1.4c.6-.6 1.5-.6 2.1 0z"/>
                                        </svg>
                                    </span>

                                    <span>Phone</span>

                                </button>


                                <button class="app-icon"
                                        data-app="messages">

                                    <span class="real-icon messages-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4.2A3.5 3.5 0 0 1 4 12.5z"/>
                                        </svg>
                                    </span>

                                    <span>Messages</span>

                                </button>


                                <button class="app-icon"
                                        data-app="gallery">

                                    <span class="real-icon gallery-icon">
                                        <svg viewBox="0 0 24 24">
                                            <rect x="3"
                                                  y="3"
                                                  width="18"
                                                  height="18"
                                                  rx="3"/>
                                            <circle cx="8"
                                                    cy="8"
                                                    r="1.8"/>
                                            <path d="M4.5 18l5-5 3.5 3 2.5-2.5 4 4.5"/>
                                        </svg>
                                    </span>

                                    <span>Gallery</span>

                                </button>

                            </div>

                        </div>


                        <!-- =========================
                             PAGE 3
                        ========================== -->

                        <div class="home-page">

                            <div class="page-label">
                                MORE
                            </div>

                            <div class="app-grid">

                                <button class="app-icon"
                                        data-app="browser">

                                    <span class="real-icon browser-icon">
                                        <svg viewBox="0 0 24 24">
                                            <circle cx="12"
                                                    cy="12"
                                                    r="8"/>
                                            <path d="M4 12h16"/>
                                            <path d="M12 4c2.2 2.3 3.2 5 3.2 8S14.2 17.7 12 20"/>
                                            <path d="M12 4c-2.2 2.3-3.2 5-3.2 8S9.8 17.7 12 20"/>
                                        </svg>
                                    </span>

                                    <span>Browser</span>

                                </button>

                            </div>

                        </div>

                    </div>


                    <div id="searchResults"
                         class="search-results hidden">
                    </div>


                    <div id="pageDots"
                         class="page-dots">

                        <span class="active"></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- DOCK -->

                    <div class="android-dock">

                        <button class="dock-icon phone-icon"
                                data-app="calls">

                            <svg viewBox="0 0 24 24">
                                <path d="M6.5 3.5l3 3-2 2.2c1.2 2.4 3 4.1 5.3 5.3l2.2-2 3 3c.6.6.6 1.5 0 2.1l-1.4 1.4c-.8.8-2 1.1-3.1.7-4.8-1.7-8.5-5.4-10.2-10.2-.4-1.1-.1-2.3.7-3.1l1.4-1.4c.6-.6 1.5-.6 2.1 0z"/>
                            </svg>

                        </button>


                        <button class="dock-icon messages-icon"
                                data-app="messages">

                            <svg viewBox="0 0 24 24">
                                <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4.2A3.5 3.5 0 0 1 4 12.5z"/>
                            </svg>

                        </button>


                        <button class="dock-icon gallery-icon"
                                data-app="gallery">

                            <svg viewBox="0 0 24 24">
                                <rect x="3"
                                      y="3"
                                      width="18"
                                      height="18"
                                      rx="3"/>
                                <circle cx="8"
                                        cy="8"
                                        r="1.8"/>
                                <path d="M4.5 18l5-5 3.5 3 2.5-2.5 4 4.5"/>
                            </svg>

                        </button>


                        <button class="dock-icon browser-icon"
                                data-app="browser">

                            <svg viewBox="0 0 24 24">
                                <circle cx="12"
                                        cy="12"
                                        r="8"/>
                                <path d="M4 12h16"/>
                                <path d="M12 4c2.2 2.3 3.2 5 3.2 8S14.2 17.7 12 20"/>
                                <path d="M12 4c-2.2 2.3-3.2 5-3.2 8S9.8 17.7 12 20"/>
                            </svg>

                        </button>

                    </div>


                    <!-- ANDROID NAVIGATION -->

                    <div id="androidNav"
                         class="android-nav">

                        <button id="navBack"
                                type="button"
                                aria-label="Back">

                            <svg viewBox="0 0 24 24">
                                <path d="M19 12H5"/>
                                <path d="M11 6l-6 6 6 6"/>
                            </svg>

                        </button>


                        <button id="navHome"
                                type="button"
                                aria-label="Home">

                            <svg viewBox="0 0 24 24">
                                <circle cx="12"
                                        cy="12"
                                        r="7"/>
                            </svg>

                        </button>


                        <button id="navRecent"
                                type="button"
                                aria-label="Recent apps">

                            <svg viewBox="0 0 24 24">
                                <rect x="6"
                                      y="6"
                                      width="12"
                                      height="12"
                                      rx="1"/>
                            </svg>

                        </button>

                    </div>


                    <!-- RECENTS -->

                    <div id="recentPanel"
                         class="recent-panel hidden">

                        <div class="recent-title">
                            RECENT APPS
                        </div>

                        <div id="recentList"></div>

                        <button id="closeRecent"
                                class="recent-close">
                            CLOSE
                        </button>

                    </div>

                </div>


                <!-- =================================
                     APP SCREEN
                ================================== -->

                <div id="appScreen"
                     class="screen app-screen hidden">

                    <div class="app-topbar">

                        <button id="appBack"
                                class="android-back"
                                aria-label="Back">

                            <svg viewBox="0 0 24 24">
                                <path d="M19 12H5"/>
                                <path d="M11 6l-6 6 6 6"/>
                            </svg>

                        </button>


                        <div class="app-title">

                            <span id="appHeaderIcon"
                                  class="header-app-icon">
                            </span>

                            <span id="appHeaderName">
                                App
                            </span>

                        </div>

                    </div>


                    <iframe id="appFrame"
                            title="Phone Application">
                    </iframe>

                </div>

            </div>

        </div>

    </section>

</div>


<script src="phone.js"></script>

</body>
</html>
