<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Broken Phone</title>

    <link rel="stylesheet" href="phone.css">
</head>

<body>

    <!-- =====================================================
         INVESTIGATION CONTROLS
    ====================================================== -->

    <div id="investigationControls">

        <button
            type="button"
            id="phoneToggle"
            class="investigation-button">
            <span id="toggleText">OPEN PHONE</span>
        </button>

        <button
            type="button"
            id="victimInfoButton"
            class="investigation-button">
            VICTIM INFO
        </button>

    </div>


    <!-- =====================================================
         PHONE
    ====================================================== -->

    <main id="phoneShell" class="hidden-phone">

        <div class="phone-frame">

            <!-- =================================================
                 PHONE SCREEN
            ================================================== -->

            <div class="phone-screen">


                <!-- =============================================
                     LOCK SCREEN
                ============================================== -->

                <section
                    id="lockScreen"
                    class="phone-screen-page">

                    <div class="lock-content">

                        <div
                            id="lockTime"
                            class="lock-time">
                            12:00
                        </div>

                        <div class="lock-date">
                            Swipe up to unlock
                        </div>

                    </div>

                    <div class="lock-status">

                        <span>●</span>

                        <span id="lockStatusTime">
                            12:00
                        </span>

                    </div>

                </section>


                <!-- =============================================
                     PASSCODE SCREEN
                ============================================== -->

                <section
                    id="passcodeScreen"
                    class="phone-screen-page hidden">

                    <div class="passcode-top">

                        <span id="passcodeTime">
                            12:00
                        </span>

                        <h2>Enter Passcode</h2>

                        <div
                            id="passcodeError"
                            class="passcode-error">
                        </div>

                    </div>


                    <div
                        id="passcodeDots"
                        class="passcode-dots">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div
                        id="passcodePad"
                        class="passcode-pad">
                    </div>

                </section>


                <!-- =============================================
                     HOME SCREEN
                ============================================== -->

                <section
                    id="homeScreen"
                    class="phone-screen-page hidden">

                    <div class="home-status-bar">

                        <span id="homeStatusTime">
                            12:00
                        </span>

                        <span>
                            ● ● ●
                        </span>

                    </div>


                    <!-- SEARCH -->

                    <div class="google-search">

                        <input
                            id="appSearch"
                            type="text"
                            placeholder="Search apps..."
                            autocomplete="off">

                        <button
                            type="button"
                            id="clearSearch">
                            ×
                        </button>

                    </div>


                    <div
                        id="searchResults"
                        class="search-results hidden">
                    </div>


                    <!-- HOME PAGES -->

                    <div class="home-viewport">

                        <div
                            id="homePages"
                            class="home-pages">


                            <!-- PAGE 1 -->

                            <div class="home-page">

                                <div class="home-clock">

                                    <div
                                        id="homeBigTime">
                                        12:00
                                    </div>

                                    <div
                                        id="homeDate">
                                        Monday
                                    </div>

                                </div>


                                <div class="app-grid">

                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="calls">

                                        <span class="real-icon">
                                            ☎
                                        </span>

                                        <span>
                                            Phone
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="messages">

                                        <span class="real-icon">
                                            ✉
                                        </span>

                                        <span>
                                            Messages
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="gallery">

                                        <span class="real-icon">
                                            ▣
                                        </span>

                                        <span>
                                            Gallery
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="notes">

                                        <span class="real-icon">
                                            ▤
                                        </span>

                                        <span>
                                            Notes
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="contacts">

                                        <span class="real-icon">
                                            ♙
                                        </span>

                                        <span>
                                            Contacts
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="browser">

                                        <span class="real-icon">
                                            ◉
                                        </span>

                                        <span>
                                            Browser
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="camera">

                                        <span class="real-icon">
                                            ◇
                                        </span>

                                        <span>
                                            Camera
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="settings">

                                        <span class="real-icon">
                                            ⚙
                                        </span>

                                        <span>
                                            Settings
                                        </span>

                                    </button>

                                </div>

                            </div>


                            <!-- PAGE 2 -->

                            <div class="home-page">

                                <div class="app-grid">

                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="bank">

                                        <span class="real-icon">
                                            $
                                        </span>

                                        <span>
                                            Bank
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="music">

                                        <span class="real-icon">
                                            ♪
                                        </span>

                                        <span>
                                            Music
                                        </span>

                                    </button>


                                    <button
                                        type="button"
                                        class="app-button"
                                        data-app="clock">

                                        <span class="real-icon">
                                            ◷
                                        </span>

                                        <span>
                                            Clock
                                        </span>

                                    </button>

                                </div>

                            </div>


                            <!-- PAGE 3 -->

                            <div class="home-page">

                            </div>

                        </div>

                    </div>


                    <!-- PAGE DOTS -->

                    <div id="pageDots">

                        <span class="active"></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- ANDROID NAVIGATION -->

                    <div class="android-navigation">

                        <button
                            type="button"
                            id="navBack">
                            ◀
                        </button>

                        <button
                            type="button"
                            id="navHome">
                            ●
                        </button>

                        <button
                            type="button"
                            id="navRecent">
                            ■
                        </button>

                    </div>


                    <!-- RECENT APPS -->

                    <div
                        id="recentPanel"
                        class="recent-panel hidden">

                        <div class="recent-header">

                            <span>
                                Recent Apps
                            </span>

                            <button
                                type="button"
                                id="closeRecent">
                                ×
                            </button>

                        </div>

                        <div id="recentList"></div>

                    </div>

                </section>


                <!-- =============================================
                     APP SCREEN
                ============================================== -->

                <section
                    id="appScreen"
                    class="phone-screen-page hidden">

                    <header class="app-header">

                        <button
                            type="button"
                            id="appBack">
                            ‹
                        </button>

                        <div
                            id="appHeaderIcon"
                            class="app-header-icon">
                        </div>

                        <div
                            id="appHeaderName"
                            class="app-header-name">
                            App
                        </div>

                    </header>


                    <iframe
                        id="appFrame"
                        title="Phone App">
                    </iframe>

                </section>

            </div>

        </div>

    </main>


    <script src="phone.js"></script>

</body>

</html>
