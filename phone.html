<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaired Phone</title>
<link rel="stylesheet" href="phone.css">
</head>

<body>

<div class="investigation-stage">

  <button id="phoneToggle" class="phone-tab" type="button">
    PHONE
  </button>

  <section id="phoneShell" class="phone-shell" aria-label="Repaired phone">

    <div class="side-button side-left top"></div>
    <div class="side-button side-left middle"></div>
    <div class="side-button side-right"></div>

    <div class="phone-frame">
      <div class="phone-bezel">

        <div class="dynamic-island"></div>


        <!-- =========================
             LOCK SCREEN
        ========================== -->

        <div id="lockScreen" class="screen lock-screen">

          <div class="ios-status">
            <span id="lockStatusTime">11:48</span>
            <span class="status-icons">▮▮▮　◔　▰</span>
          </div>

          <div class="lock-date" id="lockDate">
            Tuesday, 11 March
          </div>

          <div class="lock-time" id="lockTime">
            11:48
          </div>

          <div class="lock-wallpaper-glow"></div>

          <div class="lock-bottom-area">
            <div class="lock-shortcut">▣</div>
            <div class="lock-shortcut">⌾</div>
          </div>

          <div class="lock-swipe-hint">
            Swipe up for Face ID or<br>
            Enter Passcode
          </div>


          <!-- PASSCODE -->

          <div class="passcode-area">

            <div id="passcodeDots" class="passcode-dots">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div id="passcodeError" class="passcode-error"></div>

            <div id="passcodePad" class="passcode-pad"></div>

            <button
              id="cancelPasscode"
              class="cancel-passcode"
              type="button">
              Cancel
            </button>

          </div>

        </div>


        <!-- =========================
             HOME SCREEN
        ========================== -->

        <div id="homeScreen" class="screen home-screen hidden">

          <div class="ios-status home-status">
            <span id="homeTime">11:48</span>
            <span class="status-icons">▮▮▮　◔　▰</span>
          </div>


          <!-- TOP CLOCK WIDGET -->

          <div class="home-header-widget">

            <div class="script-day" id="homeDay">
              monday
            </div>

            <div class="big-widget-time" id="homeBigTime">
              11:48
            </div>

            <div class="widget-date" id="homeWidgetDate">
              11 MARCH
            </div>

          </div>


          <div class="home-content">


            <!-- BATTERY -->

            <div class="battery-widget">

              <div class="battery-ring">
                <span>▯</span>
              </div>

              <strong>39%</strong>

              <small>Battery</small>

            </div>


            <!-- FOLDERS -->

            <div class="folder-grid">

              <button
                class="folder"
                type="button"
                data-folder="school">

                <span class="folder-icons">
                  <i>▦</i>
                  <i>▤</i>
                  <i>▧</i>
                  <i>◎</i>
                </span>

                <b>School</b>

              </button>


              <button
                class="folder"
                type="button"
                data-folder="photo">

                <span class="folder-icons">
                  <i>✂</i>
                  <i>◉</i>
                  <i>▣</i>
                  <i>⌁</i>
                </span>

                <b>Photo &amp; Video</b>

              </button>


              <button
                class="folder"
                type="button"
                data-folder="lifestyle">

                <span class="folder-icons">
                  <i>☁</i>
                  <i>✿</i>
                  <i>♥</i>
                  <i>⌂</i>
                </span>

                <b>Lifestyle</b>

              </button>


              <button
                class="folder"
                type="button"
                data-folder="social">

                <span class="folder-icons">
                  <i>◎</i>
                  <i>▶</i>
                  <i>♟</i>
                  <i>◌</i>
                </span>

                <b>Social media</b>

              </button>

            </div>


            <!-- STANDALONE APPS -->

            <div class="standalone-grid">

              <button
                class="ios-app phone-app"
                data-app="calls">

                <span class="real-icon phone-icon">
                  ☎
                </span>

                <label>Phone</label>

              </button>


              <button
                class="ios-app whatsapp-app"
                data-app="messages">

                <span class="real-icon whatsapp-icon">
                  ◔
                </span>

                <label>WhatsApp</label>

              </button>


              <button
                class="ios-app mail-app"
                data-app="notes">

                <span class="real-icon mail-icon">
                  ✉
                </span>

                <label>Mail</label>

              </button>


              <button
                class="ios-app life-app"
                data-app="contacts">

                <span class="real-icon life-icon">
                  ◎
                </span>

                <label>Life360</label>

              </button>

            </div>


            <!-- MUSIC WIDGET -->

            <div
              class="music-widget"
              data-app="music">

              <div class="music-title">
                Good Evening
              </div>

              <div class="music-days">
                M&nbsp;&nbsp; T&nbsp;&nbsp; W&nbsp;&nbsp; T&nbsp;&nbsp; F&nbsp;&nbsp; S&nbsp;&nbsp; S
              </div>

              <div class="music-track">

                <span class="album-art">
                  ♪
                </span>

                <span>
                  Homicide<br>
                  <small>
                    Love · James Art...
                  </small>
                </span>

                <b>▶Ⅱ</b>

              </div>

            </div>

          </div>


          <!-- SEARCH -->

          <div class="search-pill">
            ⌕&nbsp; Search
          </div>


          <!-- DOCK -->

          <div class="dock">

            <button
              class="dock-app messenger-app"
              data-app="messages">

              <span class="real-icon">
                ●
              </span>

            </button>


            <button
              class="dock-app sms-app"
              data-app="notes">

              <span class="real-icon">
                ●
              </span>

            </button>


            <button
              class="dock-app music-app"
              data-app="music">

              <span class="real-icon">
                ♫
              </span>

            </button>


            <button
              class="dock-app safari-app"
              data-app="browser">

              <span class="real-icon">
                ◉
              </span>

            </button>

          </div>

        </div>


        <!-- =========================
             FOLDER SCREEN
        ========================== -->

        <div
          id="folderScreen"
          class="screen folder-screen hidden">

          <div class="ios-status">

            <span id="folderTime">
              11:48
            </span>

            <span class="status-icons">
              ▮▮▮　◔　▰
            </span>

          </div>

          <button
            id="folderBack"
            class="folder-back">

            ‹

          </button>

          <h2 id="folderTitle">
            School
          </h2>

          <div
            id="folderApps"
            class="folder-apps">
          </div>

        </div>


        <!-- =========================
             EXISTING APP SCREEN
        ========================== -->

        <div
          id="appScreen"
          class="screen app-screen hidden">

          <div class="app-topbar">

            <button
              id="appBack"
              type="button">

              ‹

            </button>

            <span id="appTitle">
              App
            </span>

            <button
              id="appHome"
              type="button">

              ⌂

            </button>

          </div>


          <iframe
            id="appFrame"
            title="Phone application">
          </iframe>

        </div>


      </div>
    </div>

  </section>

</div>

<script src="phone.js"></script>

</body>
</html>
