```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Broken Phone — Work Table</title>

<link rel="stylesheet"
      href="table.css">

</head>


<body>

<main id="tableGame">


<!-- =========================================
     TABLE BACKGROUND
========================================= -->

<div id="tableScene"></div>


<!-- =========================================
     TOP UI
========================================= -->

<button id="backButton">
    ← BACK
</button>

<div class="title">
    WORK TABLE
</div>

<div class="hint">
    Search the surface carefully.
</div>


<!-- =========================================
     COLLECTIBLE ITEMS
========================================= -->

<button class="item tweezers"
        data-item="screen_connector">

    <img src="screen_connector.png"
         alt="Screen connector">

    <span>COLLECT</span>

</button>


<button class="item tape"
        data-item="cassette_tape">

    <img src="cassette_tape.png"
         alt="Cassette tape">

    <span>COLLECT</span>

</button>


<!-- =========================================
     HIDDEN LEAF PUZZLE AREA
========================================= -->

<button id="leafPuzzleTrigger"
        aria-label="Inspect scattered objects">

    <span>INSPECT</span>

</button>


<!-- =========================================
     INVENTORY
========================================= -->

<section class="inventory-panel">

    <div class="inventory-title">
        INVENTORY
    </div>

    <div id="inventorySlots"
         class="inventory-slots">
    </div>

</section>


<div id="toast"
     class="toast">
</div>


<!-- =========================================
     FLIP & MATCH MINI GAME
========================================= -->

<div id="puzzleOverlay"
     class="hidden">

    <div id="puzzleWindow">


        <button id="closePuzzle"
                aria-label="Close puzzle">
            ×
        </button>


        <div class="puzzleTitle">
            FIND THE MATCH
        </div>


        <div class="puzzleInstruction">

            These objects look similar.
            Find the two matching leaves.

        </div>


        <div id="leafGrid">
        </div>


        <div id="puzzleMessage">
        </div>


        <button id="continuePuzzle"
                class="hidden">

            CONTINUE

        </button>

    </div>

</div>


<!-- =========================================
     EVIDENCE FOUND
========================================= -->

<div id="clueOverlay"
     class="hidden">

    <div id="clueWindow">


        <div class="clueTitle">
            EVIDENCE FOUND
        </div>


        <div class="clueText">

            A small leaf is caught beneath
            the tape.

            <br><br>

            It isn't from any plant inside
            the precinct.

            <br><br>

            <strong>
                CLUE ADDED TO INVESTIGATION.
            </strong>

        </div>


        <button id="closeClue">

            CONTINUE

        </button>

    </div>

</div>


<!-- =========================================
     AUDIO
========================================= -->

<audio id="music"
       src="investigation_music.mp3"
       loop>
</audio>


<audio id="collectSound"
       src="item_collect.mp3">
</audio>


<audio id="flipSound"
       src="item_collect.mp3">
</audio>


</main>


<script src="table.js"></script>

</body>

</html>
```
