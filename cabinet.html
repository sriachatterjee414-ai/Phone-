<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Broken Phone — File Cabinet</title>

<link rel="stylesheet" href="cabinet.css">

</head>


<body>

<main id="cabinetGame">

    <!-- =================================
         CABINET BACKGROUND
    ================================== -->

    <div id="cabinetScene"></div>


    <!-- =================================
         TOP UI
    ================================== -->

    <button id="backButton">
        ← BACK
    </button>

    <div class="title">
        FILE CABINET
    </div>


    <!-- =================================
         UNLOCK BUTTON
    ================================== -->

    <button id="unlockButton">
        UNLOCK
    </button>


    <!-- =================================
         COLLECTIBLE ITEMS
         HIDDEN UNTIL CABINET IS UNLOCKED
    ================================== -->

    <div id="itemsLayer" class="hidden">

        <button
            class="item connector"
            data-item="replacement_battery"
        >

            <img
                src="replacement_battery.png"
                alt="Replacement battery"
            >

            <span>COLLECT</span>

        </button>


        <button
            class="item clip"
            data-item="paper_clip"
        >

            <img
                src="paper_clip.png"
                alt="Paper clip"
            >

            <span>COLLECT</span>

        </button>

    </div>


    <!-- =================================
         INVENTORY
    ================================== -->

    <section class="inventory-panel">

        <div class="inventory-title">
            INVENTORY
        </div>

        <div
            id="inventorySlots"
            class="inventory-slots"
        ></div>

    </section>


    <!-- =================================
         TOAST
    ================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- =================================
         LEAF PUZZLE
    ================================== -->

    <div
        id="puzzleOverlay"
        class="hidden"
    >

        <div id="puzzleWindow">

            <button
                id="closePuzzle"
                class="closeButton"
            >
                ×
            </button>


            <div class="puzzleTitle">
                MATCH THE EVIDENCE
            </div>


            <div class="puzzleInstruction">

                Find the two matching leaves.

            </div>


            <div id="leafGrid"></div>


            <div id="puzzleMessage"></div>


            <button
                id="continuePuzzle"
                class="hidden"
            >
                UNLOCK CABINET
            </button>

        </div>

    </div>


    <!-- =================================
         AUDIO
    ================================== -->

    <audio
        id="music"
        src="investigation_music.mp3"
        loop
    ></audio>

    <audio
        id="collectSound"
        src="item_collect.mp3"
    ></audio>

    <audio
        id="flipSound"
        src="item_collect.mp3"
    ></audio>


</main>


<script src="cabinet.js"></script>

</body>

</html>
