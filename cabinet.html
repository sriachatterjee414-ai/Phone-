<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Broken Phone — File Cabinet</title>
<link rel="stylesheet" href="cabinet.css">
</head>
<body>
<main id="cabinetGame">
<div id="cabinetScene"></div>
<button id="backButton">← BACK</button>
<div class="title">FILE CABINET</div>
<div class="hint">Something useful may have been left behind.</div>

<button class="item connector" data-item="replacement_battery">
<img src="replacement_battery.png" alt="Replacement battery"><span>COLLECT</span>
</button>
<button class="item clip" data-item="paper_clip">
<img src="paper_clip.png" alt="Paper clip"><span>COLLECT</span>
</button>

<section class="inventory-panel">
<div class="inventory-title">INVENTORY</div><div id="inventorySlots" class="inventory-slots"></div>
</section>
<div id="toast" class="toast"></div>
<audio id="music" src="investigation_music.mp3" loop></audio>
<audio id="collectSound" src="item_collect.mp3"></audio>
</main>
<script src="cabinet.js"></script>
</body>
</html>
